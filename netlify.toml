[build]
  command = "npm run build"
  publish = "dist"
  environment = { SECRETS_SCAN_ENABLED = "false", SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB_NAME,MONGODB_URI,PORT" }

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB_NAME,MONGODB_URI,PORT"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: all other routes route to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
